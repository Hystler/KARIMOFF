plugins {
    id "com.android.application"
}

android {
    namespace "ru.karimoff.evotor.bridge"
    compileSdk 35

    defaultConfig {
        applicationId "ru.karimoff.evotor.bridge"
        minSdk 23
        targetSdk 35
        versionCode 15
        versionName "0.15"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.github.evotor:integration-library:v0.6.39"
    implementation "com.github.evotor:device-drivers:v3.4.0"
}
